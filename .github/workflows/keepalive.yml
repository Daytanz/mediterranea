name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 20 https://mediterranea.onrender.com/api/health > /dev/null
