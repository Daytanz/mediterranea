name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          set -e
          echo "Ping /api/health"
          curl -fsS --connect-timeout 10 --max-time 120 --retry 5 --retry-all-errors --retry-delay 5 \
            -w "health_http=%{http_code} time_total=%{time_total}\n" \
            https://mediterranea.onrender.com/api/health > /dev/null
          echo "Ping /api/categorias"
          curl -fsS --connect-timeout 10 --max-time 120 --retry 5 --retry-all-errors --retry-delay 5 \
            -w "categorias_http=%{http_code} time_total=%{time_total}\n" \
            https://mediterranea.onrender.com/api/categorias > /dev/null
